<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NexusDL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/32.png" alt="" width="20" height="20" />
      <h1>NexusDL</h1>
    </header>
    <p id="status" class="status" data-state="checking" role="status">Checking for the NexusDL app…</p>
    <label class="toggle">
      <input id="enabled" type="checkbox" />
      <span>Capture downloads</span>
    </label>
    <details>
      <summary>File types and size</summary>
      <label>
        File types
        <textarea id="extensions" rows="4" spellcheck="false"></textarea>
      </label>
      <label>
        Skip files smaller than (KB)
        <input id="min-size" type="number" min="0" step="1" />
      </label>
      <button id="save" type="button">Save</button>
      <span id="saved" class="saved" hidden>Saved</span>
    </details>
    <p class="hint">Right-click a link and choose “Download with NexusDL” to send it directly.</p>
    <script src="popup.js"></script>
  </body>
</html>
