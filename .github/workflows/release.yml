name: Release

# Push a `v*` tag, or run manually with the tag to create. The full CI suite
# must pass before installers are built for Windows, macOS and Linux and
# attached to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release, e.g. v0.1.0
        required: true
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match app version v$version"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: NexusDL ${{ needs.version.outputs.tag }}
          releaseBody: See CHANGELOG.md for what's in this release. Installers are unsigned.
          releaseDraft: false
          prerelease: ${{ github.event_name == 'push' || inputs.prerelease }}
          args: ${{ matrix.args }}

  extension:
    # Attach the browser extension to the release the app builds created.
    needs: [version, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexusdl/extension build
      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          cd apps/extension/dist
          for browser in chromium firefox; do
            (cd "$browser" && zip -qr "../NexusDL-extension-${browser}-${version}.zip" .)
          done
          gh release upload "$TAG" NexusDL-extension-*.zip --clobber
